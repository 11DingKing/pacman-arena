server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:pacman}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境必须通过环境变量 JWT_SECRET 设置安全的密钥，不提供默认值
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

# 支付宝：模拟模式无需配置密钥，真实环境需配置沙箱/正式密钥
alipay:
  mock: ${ALIPAY_MOCK:true}
  app-id: ${ALIPAY_APP_ID:2021000000000000}
  private-key: ${ALIPAY_PRIVATE_KEY:your-private-key}
  public-key: ${ALIPAY_PUBLIC_KEY:your-public-key}
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/api/payment/alipay/notify}
  return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/payment/result}

# CORS 配置：生产环境应通过环境变量限制允许的来源域名
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:8081,http://localhost:8082}

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

logging:
  level:
    com.pacman: DEBUG
