services:
  mysql:
    image: mysql:8.0
    container_name: pacman-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: pacman
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pacman-backend
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: pacman
      MYSQL_USER: root
      MYSQL_PASSWORD: root123
      # JWT 密钥：生产环境建议通过 .env 文件设置更安全的密钥
      JWT_SECRET: ${JWT_SECRET:-pacman-docker-default-jwt-secret-key-2024}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # CORS 配置
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:8082}
      # 支付宝配置
      ALIPAY_MOCK: ${ALIPAY_MOCK:-true}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-http://localhost:8080/api/payment/alipay/notify}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-http://localhost:8081/payment/result}
      # SpringDoc 配置（生产环境可设置为 false 禁用 API 文档）
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend-user:
    build:
      context: ./frontend-user
      dockerfile: Dockerfile
    container_name: pacman-frontend-user
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: pacman-frontend-admin
    ports:
      - "8082:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
